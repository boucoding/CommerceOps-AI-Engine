name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, tests, evaluation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: commerceops_test
          POSTGRES_USER: commerceops
          POSTGRES_PASSWORD: commerceops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerceops -d commerceops_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://commerceops:commerceops@localhost:5432/commerceops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov --cov-report=term-missing
      - name: Evaluate the recorded agent run (skipped until fixtures/llm_recordings.json exists)
        if: hashFiles('fixtures/llm_recordings.json') != ''
        env:
          DATABASE_URL: postgresql://commerceops:commerceops@localhost:5432/commerceops_test
          LLM_MODE: replay
        run: |
          python -m src.cli eval --min-intent-accuracy 0.9 --min-order-recall 0.9 --output eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image + compose test run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env
      - name: Build runtime and test images
        run: docker compose --profile test build
      - name: Run the test suite inside the stack
        run: docker compose --profile test run --rm tests
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
