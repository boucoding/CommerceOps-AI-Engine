# CommerceOps AI Engine
#   docker compose up -d --build                      API on http://localhost:8000 (+ PostgreSQL)
#   docker compose --profile batch run --rm pipeline  process data/inbound_customer_emails.csv -> ./exports
#   docker compose --profile test run --rm tests      full test suite against the stack's database
# Requires a .env file (cp .env.example .env).

x-app: &app
  build:
    context: .
    target: runtime
  image: commerceops-ai-engine:latest
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerceops}
      POSTGRES_USER: ${POSTGRES_USER:-commerceops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Not published to the host by default. For local tools, uncomment:
    # ports: ["127.0.0.1:5432:5432"]

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  pipeline:
    <<: *app
    profiles: ["batch"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["python", "-m", "src.cli", "run"]
    volumes:
      - ./exports:/app/exports

  tests:
    <<: *app
    build:
      context: .
      target: test
    image: commerceops-ai-engine:test
    profiles: ["test"]
    environment:
      <<: *app-env
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-commerceops}:${POSTGRES_PASSWORD}@db:5432/commerceops_test
    command: ["pytest", "-q", "-p", "no:cacheprovider", "--cov", "--cov-report=term-missing"]

volumes:
  pgdata:
